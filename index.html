<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Noto+Sans+SC:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --accent: #f0c040;
      --text: #e8e4dc;
      --muted: #6b6560;
      --surface: #141418;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Noto Sans SC', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景光晕 */
    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(240,192,64,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    .card {
      text-align: center;
      padding: 4rem 5rem;
      background: var(--surface);
      border: 1px solid rgba(240,192,64,0.1);
      border-radius: 2px;
      position: relative;
      animation: fadeUp 0.8s ease forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .greeting {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      color: var(--accent);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }

    .name span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    /* 角落装饰 */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.3;
    }
    .card::before {
      top: -1px; left: -1px;
      border-width: 1px 0 0 1px;
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-width: 0 1px 1px 0;
    }

    .time {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="greeting">Hello, You are</div>
    <div class="name">你的<span>名字</span></div>
    <div class="subtitle">这是我的第一个网页，很高兴认识你</div>
    <div class="time" id="clock"></div>
  </div>

  <script>
    // 把"你的名字"改成你自己的名字
    // 实时显示时间
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleString('zh-CN', { hour12: false });
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
